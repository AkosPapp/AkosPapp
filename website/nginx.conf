server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /robots.txt {
        try_files $uri =404;
    }

    location ~* \.(html)$ {
        add_header Cache-Control "no-cache";
    }
}
